global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: accountmanager-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api-1:8080
        labels:
          service: accountmanager
          api_instance: api-1
      - targets:
          - api-2:8080
        labels:
          service: accountmanager
          api_instance: api-2
